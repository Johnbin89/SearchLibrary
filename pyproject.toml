[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "libsearch"
# Kept in step with the git tag by the version-guard step in
# .github/workflows/release.yml, which refuses to release when the tag and
# this value disagree. Bump this and run `uv lock` before tagging.
version = "0.1.0rc1"
description = "A library of search algorithms"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ioannis Biniaris", email = "john_biniaris@hotmail.com" },
]
keywords = [
    "a-star",
    "best-first-search",
    "branch-and-bound",
    "breadth-first-search",
    "depth-first-search",
    "heuristic",
    "iterative-deepening",
    "iterative-deepening-a-star",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Johnbin89/SearchLibrary"
Repository = "https://github.com/Johnbin89/SearchLibrary"
Issues = "https://github.com/Johnbin89/SearchLibrary/issues"
# PyPI gives a recognised "Changelog" label its own entry in the sidebar.
Changelog = "https://github.com/Johnbin89/SearchLibrary/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# Only the maze visualiser in examples/ needs this; the library itself has
# no runtime dependencies.
examples = ["pillow"]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["libsearch"]
exclude = ["libsearch/test"]

# The sdist carries the full project: library, tests and examples.
[tool.hatch.build.targets.sdist]
include = [
    "libsearch",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    ".coveragerc",
]

[tool.pytest.ini_options]
testpaths = ["libsearch/test"]

[tool.ruff]
target-version = "py39"
line-length = 127

# The ruleset is pinned explicitly rather than left to ruff's defaults, so a
# ruff upgrade cannot fail CI on code that has not changed. This mirrors what
# the old flake8 job hard-failed on: syntax errors, broken comparisons,
# misplaced statements and undefined names.
#
# The wider default set currently reports 85 style findings (mostly
# str.format -> f-string). Those are worth a dedicated cleanup pass; widening
# this list is how to start it.
[tool.ruff.lint]
select = ["E7", "E9", "F63", "F7", "F82"]
